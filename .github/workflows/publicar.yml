name: Publicar

# InroScan se mudó a Inroprin-Apps/InroScan (https://inroprin-apps.github.io/InroScan/web/).
# Este repositorio solo publica páginas que redirigen allá, y un trabajador
# que da de baja la app guardada en los equipos que la usaron acá.
# Requiere que en Settings › Pages la fuente sea «GitHub Actions», y que el
# entorno github-pages permita desplegar desde estas ramas.
on:
  push:
    branches: [main, claude/vigilant-wozniak-8cgqsw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    # Las pruebas no necesitan los permisos de Pages.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  armar:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir _sitio
          cp -r sitio/. _sitio/
          touch _sitio/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
